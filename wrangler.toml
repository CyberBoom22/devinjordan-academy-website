#:schema node_modules/wrangler/config-schema.json
name = "devinjordan-academy"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
main = "./dist/_worker.js/index.js"
assets = { directory = "./dist", binding = "ASSETS" }

# Secrets are NOT set here. Set them once per environment with:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# Public (non-secret) values live in .env locally and in the Cloudflare
# dashboard for deployed environments.
[vars]
PUBLIC_SITE_URL = "https://devinjordansecuritytrainingacademy.com"
